name: Supabase Keep-Alive

# Supabase 무료 플랜은 7일간 활동이 없으면 프로젝트가 자동 정지(pause)된다.
# 매일 한 번 배포된 앱의 /api/keepalive 를 호출해 DB를 '활동 중'으로 유지한다.
# (수동 실행: Actions 탭 → 이 워크플로 → Run workflow)
on:
  schedule:
    - cron: "0 6 * * *" # 매일 UTC 06:00 (한국시간 15:00)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: |
          set -e
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 60 --retry 3 --retry-delay 10 \
            https://pokesutdy.vercel.app/api/keepalive)
          echo "keepalive HTTP status: $code"
          test "$code" = "200"
